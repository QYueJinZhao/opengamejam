<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>audio check</title>
<style>
  body { margin: 24px; background: #0b0f16; color: #dbe7ff; font: 13px/1.6 Consolas, monospace; }
  button { font: 600 14px sans-serif; padding: 10px 20px; border-radius: 8px; border: 1px solid #5ac8fa; background: #12304a; color: #dbe7ff; cursor: pointer; }
  table { margin-top: 16px; border-collapse: collapse; }
  td, th { padding: 4px 10px; border-bottom: 1px solid #1e2a3a; text-align: left; }
  .pass { color: #4cf0c0; } .fail { color: #ff5c8a; }
  #summary { margin-top: 14px; font-weight: 700; }
</style>
</head>
<body>
<h3>音频检测</h3>
<button id="run">开始检测</button>
<div id="summary">等待开始</div>
<table id="out"><thead><tr><th>项目</th><th>数值</th><th>结果</th></tr></thead><tbody></tbody></table>
<script type="module">
import { Sfx, BGM_TRACK } from './src/audio.js';

const out = document.querySelector('#out tbody');
const summary = document.querySelector('#summary');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function row(name, value, pass) {
  const tr = document.createElement('tr');
  tr.innerHTML = `<td>${name}</td><td>${value}</td><td class="${pass ? 'pass' : 'fail'}">${pass ? 'PASS' : 'FAIL'}</td>`;
  out.appendChild(tr);
  return pass;
}

async function main() {
  document.querySelector('#run').disabled = true;
  out.innerHTML = '';
  const sfx = new Sfx();
  sfx.init();
  await sfx.ctx.resume().catch(() => {});
  await sfx.loadAssets();

  const ctx = sfx.ctx;
  const split = ctx.createChannelSplitter(2);
  const anL = ctx.createAnalyser();
  const anR = ctx.createAnalyser();
  anL.fftSize = 2048; anR.fftSize = 2048;
  sfx.master.connect(split);
  split.connect(anL, 0);
  split.connect(anR, 1);
  const bufL = new Float32Array(anL.fftSize);
  const bufR = new Float32Array(anR.fftSize);

  let peakL = 0, peakR = 0, sumL = 0, sumR = 0, n = 0;
  let timer = null;
  function startMeter() {
    peakL = peakR = sumL = sumR = n = 0;
    timer = setInterval(() => {
      anL.getFloatTimeDomainData(bufL);
      anR.getFloatTimeDomainData(bufR);
      for (let i = 0; i < bufL.length; i++) {
        peakL = Math.max(peakL, Math.abs(bufL[i]));
        peakR = Math.max(peakR, Math.abs(bufR[i]));
        sumL += bufL[i] * bufL[i];
        sumR += bufR[i] * bufR[i];
        n++;
      }
    }, 12);
  }
  function stopMeter() {
    clearInterval(timer);
    return { peakL, peakR, peakRms: Math.sqrt(sumR / Math.max(1, n)), rmsL: Math.sqrt(sumL / Math.max(1, n)) };
  }
  async function measure(ms, fn) {
    startMeter();
    fn();
    await sleep(ms);
    return stopMeter();
  }

  let total = 0, pass = 0;
  const check = (name, value, ok) => { total++; if (row(name, value, ok)) pass++; };

  // 1. 资源加载
  const keys = [...sfx.bufs.keys()];
  const missing = keys.filter((k) => !sfx.bufs.get(k));
  check('样本键数量', `${keys.length} 个，缺失 ${missing.length}`, keys.length >= 17 && missing.length === 0);
  check('BGM 时长', `${(sfx.bufs.get(BGM_TRACK.key)?.duration || 0).toFixed(2)}s`, Math.abs((sfx.bufs.get(BGM_TRACK.key)?.duration || 0) - 49.56) < 0.3);

  // 2. 开火声像
  const left = await measure(500, () => sfx.fire(0, 0, 392, -0.65));
  check('开火左声像 L/R', `${left.rmsL.toFixed(4)} / ${left.peakRms.toFixed(4)}`, left.peakL > 0.01 && left.rmsL > left.peakRms * 1.15);
  const right = await measure(500, () => sfx.fire(0, 0, 392, 0.65));
  check('开火右声像 L/R', `${right.rmsL.toFixed(4)} / ${right.peakRms.toFixed(4)}`, right.peakR > 0.01 && right.peakRms > right.rmsL * 1.15);

  // 3. 材质层
  const gl = await measure(400, () => sfx.clear(1, 1, 0));
  check('三消玻璃层峰值', gl.peakR.toFixed(4), gl.peakR > 0.01);
  const gh = await measure(400, () => sfx.clear(1, 1, 2));
  check('五消玻璃层峰值', gh.peakR.toFixed(4), gh.peakR >= gl.peakR);
  const dice = await measure(500, () => sfx.clear(1, 1, 0, 'same'));
  check('骰子落桌层峰值', dice.peakR.toFixed(4), dice.peakR > 0.01);
  const card = await measure(400, () => sfx.clear(1, 1, 0, 'flush'));
  check('扑克纸牌层峰值', card.peakR.toFixed(4), card.peakR > 0.01);
  const boom = await measure(600, () => sfx.boom());
  check('爆破峰值', boom.peakR.toFixed(4), boom.peakR > 0.02);
  const chip = await measure(300, () => sfx.chip());
  check('筹码层峰值', chip.peakR.toFixed(4), chip.peakR > 0.005);
  const jingle = await measure(1200, () => sfx.jingle(true));
  check('胜利乐句峰值', jingle.peakR.toFixed(4), jingle.peakR > 0.01);

  // 4. BGM
  sfx.stopBgm(0.05);
  await sleep(200);
  const bgm = await measure(1400, () => sfx.playBgm(0.26));
  check('BGM 播放', `playing=${sfx.bgmPlaying}`, sfx.bgmPlaying === true && bgm.peakR > 0.01);
  sfx.stopBgm(0.05);
  await sleep(250);

  // 5. 静音
  sfx.setMuted(true);
  await sleep(200);
  const muted = await measure(350, () => sfx.boom());
  check('静音后峰值', muted.peakR.toFixed(5), muted.peakR < 0.005);
  sfx.setMuted(false);
  await sleep(120);

  // 6. 暂停 / 恢复
  sfx.setPaused(true);
  await sleep(250);
  check('暂停后 AudioContext', ctx.state, ctx.state === 'suspended');
  sfx.setPaused(false);
  await sleep(250);
  check('恢复后 AudioContext', ctx.state, ctx.state === 'running');

  summary.textContent = `完成：${pass}/${total} 通过`;
  document.title = `DONE ${pass}/${total}`;
}

document.querySelector('#run').addEventListener('click', () => {
  main().catch((e) => {
    summary.textContent = '异常：' + e.message;
    document.title = 'ERROR';
  });
});
</script>
</body>
</html>
