<head>

  <title>超载快车 · 抖音小游戏横屏预览</title>
  <link rel="icon" href="data:," />

      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f1629;

      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
  </style>
